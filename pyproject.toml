[project]
name = "duckbrain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tim Hiebenthal", email = "timhiebenthal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.3",
    "mcp[cli]>=1.27.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
duckbrain = "duckbrain.server:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
