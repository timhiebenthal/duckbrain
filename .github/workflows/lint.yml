name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Check lint
        run: uv run ruff check src/duckbrain/
      - name: Check formatting
        run: uv run ruff format --check src/duckbrain/
      - name: Check types
        run: uv run mypy src/duckbrain/
